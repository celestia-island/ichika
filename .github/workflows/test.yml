name: Test

on:
  workflow_dispatch:

jobs:
  family-versions:
    name: Family dependency identity
    uses: celestia-island/celestia-devtools/.github/workflows/family-versions.yml@c45f1881e00cb55d0a2a1fcf57b28734ece119bb
    with:
      devtools-ref: c45f1881e00cb55d0a2a1fcf57b28734ece119bb

  clippy:
    name: Test
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Run unit test
        run: |
          cargo test \
            --all-targets \
            --all-features \
            --no-fail-fast
