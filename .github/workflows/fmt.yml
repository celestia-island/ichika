name: Format
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fmt.yml'
      - 'packages/**/*'
      - 'examples/**/*'
      - 'Cargo.toml'
  push:
    branches: [master]

jobs:
  format:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Format
    runs-on: [self-hosted, linux, x64, local]

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt

      - name: Run fmt
        run: cargo +nightly fmt --all -- --check --unstable-features
